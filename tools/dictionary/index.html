<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionary</title>

  <link id="sp-theme-tokens" rel="stylesheet">
  <link id="sp-theme-active" rel="stylesheet">

  <link rel="stylesheet" href="../../Styles/Tokens/base.css">
  <link rel="stylesheet" href="../../Styles/main.css">
  <link rel="stylesheet" href="../../Styles/Components/Components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components@latest/atomics.css">
  <link rel="stylesheet" href="dictionary.css">
</head>
<body>
  <sp-theme></sp-theme>
  <sp-nav sticky>
    <span slot="brand">Dictionary</span>
  </sp-nav>

  <div class="container">
    <header class="page-header">
      <h1>Dictionary</h1>
      <p class="tagline">Look up any English word — definitions, examples, and pronunciation</p>
    </header>

    <div class="search-box">
      <input id="word-input" type="text" placeholder="Type a word, e.g. serendipity" autofocus />
      <sp-button variant="primary" id="search-btn">Search</sp-button>
    </div>

    <div class="lists">
      <div class="list-row" id="recents-row">
        <span class="list-label">
          <sp-icon name="clock" size="sm"></sp-icon>
          Recent
        </span>
      </div>
      <div class="list-row" id="favorites-row">
        <span class="list-label">
          <sp-icon name="star-filled" size="sm"></sp-icon>
          Saved
        </span>
      </div>
    </div>

    <div id="result">
      <div class="status">Enter a word above to get started.</div>
    </div>
  </div>

  <sp-modal id="modal" heading="All words">
    <div id="modal-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    <sp-button slot="footer" variant="danger" id="modal-clear">Clear all</sp-button>
  </sp-modal>

  <script type="module">
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-theme.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-nav.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-button.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-modal.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-tag.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-icon.js'
  </script>
  <script src="dictionary.js"></script>
</body>
</html>
