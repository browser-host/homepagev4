<!-- SlopWare -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Studio</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a1d23;
      --panel: #20242c;
      --surface: #171a20;
      --border: #2e3340;
      --text: #d4d8e2;
      --muted: #5a6070;
      --accent: #3a9faa;
      --accent-dim: rgba(58, 159, 170, 0.12);
      --panel-w: 320px;
      --font: 'Courier New', 'Lucida Console', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── PREVIEW ─────────────────────────────── */
    #preview {
      flex: 1;
      position: relative;
      transition: background 0.35s ease;
    }

    #css-output {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(20, 23, 28, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      word-break: break-all;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    #css-output:hover {
      background: rgba(20, 23, 28, 0.85);
    }

    #css-output .copy-label {
      color: var(--accent);
      font-size: 10px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── PANEL ────────────────────────────────── */
    #panel {
      width: var(--panel-w);
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #panel::-webkit-scrollbar {
      width: 3px;
    }

    #panel::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .panel-header {
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }

    .section {
      padding: 16px 18px 0;
    }

    .section:last-child {
      padding-bottom: 20px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── TYPE BUTTONS ────────────────────────── */
    .type-row {
      display: flex;
      gap: 5px;
      margin-bottom: 16px;
    }

    .type-btn {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .type-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── ANGLE ───────────────────────────────── */
    .angle-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    #angle-dial {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      position: relative;
      cursor: grab;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    #angle-dial:hover {
      border-color: var(--accent);
    }

    #angle-dial:active {
      cursor: grabbing;
    }

    #dial-needle {
      position: absolute;
      top: 7px;
      left: 50%;
      width: 2px;
      height: 12px;
      background: var(--accent);
      border-radius: 1px;
      transform-origin: bottom center;
      margin-left: -1px;
      pointer-events: none;
    }

    .angle-val {
      font-size: 26px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .angle-unit {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    #angle-slider {
      width: 100%;
      -webkit-appearance: none;
      height: 2px;
      border-radius: 1px;
      background: var(--border);
      outline: none;
      margin-bottom: 16px;
      cursor: pointer;
    }

    #angle-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* ── STOP BAR ────────────────────────────── */
    #stop-bar-wrap {
      position: relative;
      margin-bottom: 26px;
      user-select: none;
    }

    #stop-bar {
      width: 100%;
      height: 28px;
      border-radius: 6px;
      cursor: crosshair;
      position: relative;
      border: 1px solid var(--border);
    }

    .stop-handle {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 20px;
      transform: translate(-50%, -50%);
      border-radius: 3px;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.3);
      cursor: ew-resize;
      z-index: 2;
      transition: box-shadow 0.1s;
    }

    .stop-handle:hover,
    .stop-handle.dragging {
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--accent);
      z-index: 3;
    }

    .stop-handle-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── COLOR LIST ──────────────────────────── */
    #colors-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .color-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 9px;
    }

    .swatch-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.15s;
      position: relative;
    }

    .swatch-btn:hover {
      border-color: var(--accent);
    }

    .swatch-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .color-hex {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 11px;
      outline: none;
      min-width: 0;
    }

    .color-stop-label {
      font-size: 10px;
      color: var(--muted);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--border);
    }

    .icon-btn.locked {
      color: var(--accent);
    }

    /* ── CUSTOM COLOR PICKER POPUP ───────────── */
    #color-picker-popup {
      position: fixed;
      z-index: 1000;
      background: #1c2028;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      width: 220px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      display: none;
      user-select: none;
    }

    #color-picker-popup.visible {
      display: block;
    }

    /* SV box */
    #cp-sv-box {
      width: 100%;
      height: 150px;
      border-radius: 6px;
      position: relative;
      cursor: crosshair;
      margin-bottom: 10px;
      overflow: hidden;
    }

    #cp-sv-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #cp-sv-cursor {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Hue bar */
    #cp-hue-bar {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      position: relative;
      cursor: ew-resize;
      margin-bottom: 8px;
      background: linear-gradient(to right,
          #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    }

    #cp-hue-cursor {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Alpha bar */
    #cp-alpha-bar {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      position: relative;
      cursor: ew-resize;
      margin-bottom: 10px;
      overflow: hidden;
    }

    #cp-alpha-checker {
      position: absolute;
      inset: 0;
      background-image: repeating-conic-gradient(#555 0% 25%, #333 0% 50%);
      background-size: 8px 8px;
      border-radius: 6px;
    }

    #cp-alpha-gradient {
      position: absolute;
      inset: 0;
      border-radius: 6px;
    }

    #cp-alpha-cursor {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #cp-hex-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #cp-preview-swatch {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #cp-hex-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 4px;
      outline: none;
    }

    #cp-hex-input:focus {
      border-color: var(--accent);
    }

    #cp-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 3px;
    }

    #cp-close:hover {
      color: var(--text);
      background: var(--border);
    }

    /* ── ACTION BUTTONS ──────────────────────── */
    .btn-add {
      width: 100%;
      padding: 8px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    .btn-add:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 5px;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .btn:hover {
      background: var(--border);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0e1418;
      font-weight: bold;
    }

    .btn.primary:hover {
      background: #4ab5c0;
      border-color: #4ab5c0;
    }

    .btn.download {
      background: transparent;
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.download:hover {
      background: var(--accent-dim);
    }

    /* ── PRESETS ─────────────────────────────── */
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .preset {
      aspect-ratio: 1;
      border-radius: 5px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }

    .preset:hover {
      border-color: var(--accent);
      transform: scale(1.07);
    }

    .hr {
      height: 1px;
      background: var(--border);
      margin: 16px 0 0;
    }
  </style>
</head>

<body>

  <div id="preview">
    <div id="css-output">
      <span class="copy-label">[ copy css ]</span>
      <span id="css-text"></span>
    </div>
  </div>

  <div id="panel">
    <div class="panel-header">
      <div class="header-dot"></div>
      Gradient Studio
    </div>

    <div class="section">
      <div style="height:14px"></div>
      <div class="section-label">Type</div>
      <div class="type-row">
        <button class="type-btn active" data-type="linear">Linear</button>
        <button class="type-btn" data-type="radial">Radial</button>
        <button class="type-btn" data-type="conic">Conic</button>
      </div>
      <div class="section-label">Angle</div>
      <div class="angle-row">
        <div id="angle-dial">
          <div id="dial-needle"></div>
        </div>
        <div>
          <div class="angle-val" id="angle-display">90</div>
          <div class="angle-unit">degrees</div>
        </div>
      </div>
      <input type="range" id="angle-slider" min="0" max="360" value="90">
    </div>

    <div class="section">
      <div class="section-label">Colors</div>
      <div id="stop-bar-wrap">
        <div id="stop-bar"></div>
      </div>
      <div id="colors-list"></div>
      <button class="btn-add" id="btn-add-color">+ add color stop</button>
      <div class="btn-row">
        <button class="btn primary" id="btn-randomize">⟳ Randomize</button>
        <button class="btn" id="btn-random-angle">⟳ Angle</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-reverse">⇄ Reverse</button>
        <button class="btn" id="btn-clear-locks">Unlock All</button>
      </div>
      <div class="btn-row">
        <button class="btn download" id="btn-download">↓ Download 4K PNG</button>
      </div>
    </div>

    <div class="section">
      <div class="hr"></div>
      <div style="height:16px"></div>
      <div class="section-label">Presets</div>
      <div class="presets-grid" id="presets-grid"></div>
    </div>
  </div>

  <!-- Custom Color Picker Popup -->
  <div id="color-picker-popup">
    <div id="cp-sv-box">
      <canvas id="cp-sv-canvas"></canvas>
      <div id="cp-sv-cursor"></div>
    </div>
    <div id="cp-hue-bar">
      <div id="cp-hue-cursor"></div>
    </div>
    <div id="cp-alpha-bar">
      <div id="cp-alpha-checker"></div>
      <div id="cp-alpha-gradient"></div>
      <div id="cp-alpha-cursor"></div>
    </div>
    <div id="cp-hex-row">
      <div id="cp-preview-swatch"></div>
      <input id="cp-hex-input" type="text" maxlength="7" spellcheck="false">
      <button id="cp-close">✕</button>
    </div>
  </div>

  <script>
    // ════════════════════════════════════════════
    //  STATE
    // ════════════════════════════════════════════
    const PRESETS = [
      ['#ff6b6b', '#ffd93d'], ['#6c63ff', '#3ecf8e'], ['#f953c6', '#b91d73'],
      ['#43e97b', '#38f9d7'], ['#fa709a', '#fee140'], ['#a18cd1', '#fbc2eb'],
      ['#fccb90', '#d57eeb'], ['#0093e9', '#80d0c7'], ['#c471ed', '#f64f59'],
      ['#4facfe', '#00f2fe'], ['#f77062', '#fe5196'], ['#2af598', '#009efd'],
      ['#0fd850', '#f9f047'], ['#96fbc4', '#f9f586'], ['#ee9ca7', '#ffdde1'],
    ];

    let state = {
      type: 'linear', angle: 90,
      colors: [
        { hex: '#3a9faa', stop: 0, locked: false },
        { hex: '#6c63ff', stop: 100, locked: false },
      ]
    };

    // ════════════════════════════════════════════
    //  DOM REFS
    // ════════════════════════════════════════════
    const preview = document.getElementById('preview');
    const angleDisp = document.getElementById('angle-display');
    const angleSlider = document.getElementById('angle-slider');
    const angleDial = document.getElementById('angle-dial');
    const dialNeedle = document.getElementById('dial-needle');
    const colorsList = document.getElementById('colors-list');
    const cssTextEl = document.getElementById('css-text');
    const cssOutput = document.getElementById('css-output');
    const presetsGrid = document.getElementById('presets-grid');
    const stopBar = document.getElementById('stop-bar');

    // ════════════════════════════════════════════
    //  GRADIENT BUILDER
    // ════════════════════════════════════════════
    function buildGradient() {
      const sorted = [...state.colors].sort((a, b) => a.stop - b.stop);
      const stops = sorted.map(c => `${c.hex} ${c.stop}%`).join(', ');
      if (state.type === 'linear') return `linear-gradient(${state.angle}deg, ${stops})`;
      if (state.type === 'radial') return `radial-gradient(circle, ${stops})`;
      return `conic-gradient(from ${state.angle}deg, ${stops})`;
    }

    function applyGradient() {
      preview.style.background = buildGradient();
      cssTextEl.textContent = `background: ${buildGradient()};`;
    }

    function render() {
      applyGradient();
      angleDisp.textContent = state.angle;
      angleSlider.value = state.angle;
      dialNeedle.style.transform = `rotate(${state.angle}deg)`;
      renderColors();
      renderStopBar();
    }

    // ════════════════════════════════════════════
    //  COLOR LIST
    // ════════════════════════════════════════════
    function renderColors() {
      colorsList.innerHTML = '';
      state.colors.forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'color-item';

        const swatch = document.createElement('div');
        swatch.className = 'swatch-btn';
        swatch.style.background = c.hex;
        swatch.addEventListener('click', () => openPicker(i, swatch));

        const hexInput = document.createElement('input');
        hexInput.className = 'color-hex';
        hexInput.type = 'text';
        hexInput.value = c.hex;
        hexInput.maxLength = 7;
        hexInput.addEventListener('change', e => {
          const v = e.target.value.trim();
          if (/^#[0-9a-fA-F]{6}$/.test(v)) {
            state.colors[i].hex = v;
            swatch.style.background = v;
            render();
          }
        });

        const stopLabel = document.createElement('span');
        stopLabel.className = 'color-stop-label';
        stopLabel.textContent = c.stop + '%';

        const lockBtn = document.createElement('button');
        lockBtn.className = 'icon-btn' + (c.locked ? ' locked' : '');
        lockBtn.title = c.locked ? 'Unlock' : 'Lock';
        lockBtn.textContent = c.locked ? '🔒' : '🔓';
        lockBtn.addEventListener('click', () => { state.colors[i].locked = !state.colors[i].locked; renderColors(); });

        const removeBtn = document.createElement('button');
        removeBtn.className = 'icon-btn';
        removeBtn.title = 'Remove';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => {
          if (state.colors.length <= 2) return;
          state.colors.splice(i, 1);
          redistributeStops();
          render();
        });

        item.appendChild(swatch);
        item.appendChild(hexInput);
        item.appendChild(stopLabel);
        item.appendChild(lockBtn);
        item.appendChild(removeBtn);
        colorsList.appendChild(item);
      });
    }

    function redistributeStops() {
      const n = state.colors.length;
      state.colors.forEach((c, i) => { c.stop = Math.round((i / (n - 1)) * 100); });
    }

    // ════════════════════════════════════════════
    //  CUSTOM COLOR PICKER
    // ════════════════════════════════════════════
    const picker = document.getElementById('color-picker-popup');
    const svBox = document.getElementById('cp-sv-box');
    const svCanvas = document.getElementById('cp-sv-canvas');
    const svCursor = document.getElementById('cp-sv-cursor');
    const hueBar = document.getElementById('cp-hue-bar');
    const hueCursor = document.getElementById('cp-hue-cursor');
    const alphaBar = document.getElementById('cp-alpha-bar');
    const alphaGrad = document.getElementById('cp-alpha-gradient');
    const alphaCur = document.getElementById('cp-alpha-cursor');
    const cpHex = document.getElementById('cp-hex-input');
    const cpSwatch = document.getElementById('cp-preview-swatch');
    const cpClose = document.getElementById('cp-close');

    let cpState = { colorIndex: -1, h: 0, s: 1, v: 1, a: 1 };
    let cpDrag = null; // 'sv' | 'hue' | 'alpha'

    function hexToHsv(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0, s = max === 0 ? 0 : d / max, v = max;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
      }
      return { h: h * 360, s, v };
    }

    function hsvToHex(h, s, v) {
      h = h / 360;
      let r, g, b;
      const i = Math.floor(h * 6);
      const f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
      switch (i % 6) {
        case 0: r = v; g = t; b = p; break; case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break; case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break; case 5: r = v; g = p; b = q; break;
      }
      return '#' + [r, g, b].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
    }

    function hsvToRgb(h, s, v) {
      const hex = hsvToHex(h, s, v);
      return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    }

    function drawSVCanvas() {
      const ctx = svCanvas.getContext('2d');
      const w = svBox.clientWidth, h = svBox.clientHeight;
      svCanvas.width = w; svCanvas.height = h;
      // Hue base
      const hueColor = hsvToHex(cpState.h, 1, 1);
      ctx.fillStyle = hueColor;
      ctx.fillRect(0, 0, w, h);
      // White gradient left→right
      const wg = ctx.createLinearGradient(0, 0, w, 0);
      wg.addColorStop(0, 'rgba(255,255,255,1)');
      wg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = wg;
      ctx.fillRect(0, 0, w, h);
      // Black gradient top→bottom
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, 'rgba(0,0,0,0)');
      bg.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
    }

    function updateSVCursor() {
      const w = svBox.clientWidth, h = svBox.clientHeight;
      svCursor.style.left = (cpState.s * w) + 'px';
      svCursor.style.top = ((1 - cpState.v) * h) + 'px';
    }

    function updateHueCursor() {
      hueCursor.style.left = (cpState.h / 360 * 100) + '%';
    }

    function updateAlphaBar() {
      const [r, g, b] = hsvToRgb(cpState.h, cpState.s, cpState.v);
      alphaGrad.style.background = `linear-gradient(to right, rgba(${r},${g},${b},0), rgba(${r},${g},${b},1))`;
      alphaCur.style.left = (cpState.a * 100) + '%';
    }

    function updatePickerHex() {
      const hex = hsvToHex(cpState.h, cpState.s, cpState.v);
      cpHex.value = hex;
      cpSwatch.style.background = hex;
    }

    function pickerChanged() {
      drawSVCanvas();
      updateSVCursor();
      updateHueCursor();
      updateAlphaBar();
      updatePickerHex();
      // Live update state
      if (cpState.colorIndex >= 0) {
        const hex = hsvToHex(cpState.h, cpState.s, cpState.v);
        state.colors[cpState.colorIndex].hex = hex;
        applyGradient();
        renderStopBar();
        // update swatch and hex in list without full re-render
        const swatches = colorsList.querySelectorAll('.swatch-btn');
        const hexes = colorsList.querySelectorAll('.color-hex');
        if (swatches[cpState.colorIndex]) swatches[cpState.colorIndex].style.background = hex;
        if (hexes[cpState.colorIndex]) hexes[cpState.colorIndex].value = hex;
      }
    }

    function openPicker(colorIndex, anchorEl) {
      // Mark active swatch
      colorsList.querySelectorAll('.swatch-btn').forEach(s => s.classList.remove('active'));
      anchorEl.classList.add('active');

      cpState.colorIndex = colorIndex;
      const hsv = hexToHsv(state.colors[colorIndex].hex);
      cpState.h = hsv.h; cpState.s = hsv.s; cpState.v = hsv.v; cpState.a = 1;

      picker.classList.add('visible');
      positionPicker(anchorEl);
      // Draw after visible so dimensions are available
      requestAnimationFrame(() => {
        drawSVCanvas();
        updateSVCursor();
        updateHueCursor();
        updateAlphaBar();
        updatePickerHex();
      });
    }

    function positionPicker(anchor) {
      const ar = anchor.getBoundingClientRect();
      const pw = 220, ph = 240;
      let left = ar.left - pw - 10;
      let top = ar.top;
      if (left < 8) left = ar.right + 10;
      if (top + ph > window.innerHeight - 8) top = window.innerHeight - ph - 8;
      picker.style.left = left + 'px';
      picker.style.top = top + 'px';
    }

    function closePicker() {
      picker.classList.remove('visible');
      colorsList.querySelectorAll('.swatch-btn').forEach(s => s.classList.remove('active'));
      cpState.colorIndex = -1;
    }

    cpClose.addEventListener('click', closePicker);

    // SV drag
    svBox.addEventListener('mousedown', e => { cpDrag = 'sv'; handleSVDrag(e); e.preventDefault(); });
    hueBar.addEventListener('mousedown', e => { cpDrag = 'hue'; handleHueDrag(e); e.preventDefault(); });
    alphaBar.addEventListener('mousedown', e => { cpDrag = 'alpha'; handleAlphaDrag(e); e.preventDefault(); });

    function handleSVDrag(e) {
      const r = svBox.getBoundingClientRect();
      cpState.s = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      cpState.v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
      pickerChanged();
    }
    function handleHueDrag(e) {
      const r = hueBar.getBoundingClientRect();
      cpState.h = Math.max(0, Math.min(360, (e.clientX - r.left) / r.width * 360));
      pickerChanged();
    }
    function handleAlphaDrag(e) {
      const r = alphaBar.getBoundingClientRect();
      cpState.a = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      pickerChanged();
    }

    document.addEventListener('mousemove', e => {
      if (!cpDrag) return;
      if (cpDrag === 'sv') handleSVDrag(e);
      if (cpDrag === 'hue') handleHueDrag(e);
      if (cpDrag === 'alpha') handleAlphaDrag(e);
    });
    document.addEventListener('mouseup', () => { cpDrag = null; });

    cpHex.addEventListener('change', e => {
      const v = e.target.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        const hsv = hexToHsv(v);
        cpState.h = hsv.h; cpState.s = hsv.s; cpState.v = hsv.v;
        pickerChanged();
      }
    });

    // Close picker when clicking outside
    document.addEventListener('mousedown', e => {
      if (!picker.classList.contains('visible')) return;
      if (picker.contains(e.target)) return;
      if (e.target.classList.contains('swatch-btn')) return;
      closePicker();
    });

    // ════════════════════════════════════════════
    //  STOP BAR
    // ════════════════════════════════════════════
    let stopDrag = null;

    function renderStopBar() {
      const sorted = [...state.colors].sort((a, b) => a.stop - b.stop);
      const stops = sorted.map(c => `${c.hex} ${c.stop}%`).join(', ');
      stopBar.style.background = `linear-gradient(to right, ${stops})`;
      stopBar.querySelectorAll('.stop-handle').forEach(h => h.remove());
      state.colors.forEach((c, i) => {
        const handle = document.createElement('div');
        handle.className = 'stop-handle';
        handle.style.left = c.stop + '%';
        handle.style.background = c.hex;
        handle.title = `${c.hex} — ${c.stop}%`;
        const lbl = document.createElement('span');
        lbl.className = 'stop-handle-label';
        lbl.textContent = c.stop + '%';
        handle.appendChild(lbl);
        handle.addEventListener('mousedown', e => {
          e.preventDefault(); e.stopPropagation();
          stopDrag = { index: i, startX: e.clientX, startStop: c.stop };
          handle.classList.add('dragging');
        });
        stopBar.appendChild(handle);
      });
    }

    document.addEventListener('mousemove', e => {
      if (!stopDrag) return;
      const rect = stopBar.getBoundingClientRect();
      const pct = (e.clientX - stopDrag.startX) / rect.width * 100;
      state.colors[stopDrag.index].stop = Math.round(Math.min(100, Math.max(0, stopDrag.startStop + pct)));
      // fast path
      const sorted = [...state.colors].sort((a, b) => a.stop - b.stop);
      stopBar.style.background = `linear-gradient(to right, ${sorted.map(c => `${c.hex} ${c.stop}%`).join(', ')})`;
      const handles = stopBar.querySelectorAll('.stop-handle');
      state.colors.forEach((c, i) => {
        if (handles[i]) {
          handles[i].style.left = c.stop + '%';
          const lbl = handles[i].querySelector('.stop-handle-label');
          if (lbl) lbl.textContent = c.stop + '%';
        }
      });
      applyGradient();
    });

    document.addEventListener('mouseup', () => {
      if (!stopDrag) return;
      stopBar.querySelectorAll('.stop-handle').forEach(h => h.classList.remove('dragging'));
      stopDrag = null;
      renderColors();
    });

    // ════════════════════════════════════════════
    //  ANGLE DIAL
    // ════════════════════════════════════════════
    let dialDragging = false, dialCenter = {};
    angleDial.addEventListener('mousedown', e => {
      dialDragging = true;
      const r = angleDial.getBoundingClientRect();
      dialCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dialDragging) return;
      let angle = Math.round(Math.atan2(e.clientX - dialCenter.x, -(e.clientY - dialCenter.y)) * 180 / Math.PI);
      if (angle < 0) angle += 360;
      state.angle = angle;
      render();
    });
    document.addEventListener('mouseup', () => { dialDragging = false; });

    angleSlider.addEventListener('input', e => { state.angle = parseInt(e.target.value); render(); });

    // ════════════════════════════════════════════
    //  CONTROLS
    // ════════════════════════════════════════════
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.type = btn.dataset.type;
        render();
      });
    });

    document.getElementById('btn-add-color').addEventListener('click', () => {
      state.colors.push({ hex: randomHex(), stop: 50, locked: false });
      redistributeStops(); render();
    });

    document.getElementById('btn-randomize').addEventListener('click', () => {
      state.colors = state.colors.map(c => ({ ...c, hex: c.locked ? c.hex : randomHex() }));
      render();
    });

    document.getElementById('btn-random-angle').addEventListener('click', () => {
      state.angle = Math.floor(Math.random() * 360); render();
    });

    document.getElementById('btn-reverse').addEventListener('click', () => {
      state.colors.reverse(); redistributeStops(); render();
    });

    document.getElementById('btn-clear-locks').addEventListener('click', () => {
      state.colors.forEach(c => c.locked = false); renderColors();
    });

    cssOutput.addEventListener('click', () => {
      navigator.clipboard.writeText(`background: ${buildGradient()};`).then(() => {
        const label = cssOutput.querySelector('.copy-label');
        label.textContent = '[ ✓ copied! ]';
        setTimeout(() => { label.textContent = '[ copy css ]'; }, 1600);
      });
    });

    // ════════════════════════════════════════════
    //  DOWNLOAD 4K
    // ════════════════════════════════════════════
    document.getElementById('btn-download').addEventListener('click', () => {
      const W = 3840, H = 2160;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      const sorted = [...state.colors].sort((a, b) => a.stop - b.stop);

      if (state.type === 'linear') {
        const rad = state.angle * Math.PI / 180;
        // Calculate gradient line endpoints for the bounding box
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const hw = W / 2, hh = H / 2;
        const len = Math.abs(hw * sin) + Math.abs(hh * cos);
        const x0 = hw - sin * len, y0 = hh + cos * len;
        const x1 = hw + sin * len, y1 = hh - cos * len;
        const grad = ctx.createLinearGradient(x0, y0, x1, y1);
        sorted.forEach(c => grad.addColorStop(c.stop / 100, c.hex));
        ctx.fillStyle = grad;

      } else if (state.type === 'radial') {
        const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) / 2);
        sorted.forEach(c => grad.addColorStop(c.stop / 100, c.hex));
        ctx.fillStyle = grad;

      } else {
        // Conic — draw via offscreen canvas with CSS trick won't work; use pixel math fallback
        // We'll use a series of linear sweeps to approximate conic
        const cx = W / 2, cy = H / 2;
        const totalStops = sorted.length;
        for (let deg = 0; deg < 360; deg += 0.5) {
          const t = ((deg - state.angle + 360) % 360) / 360;
          // find color at this t
          let color = sorted[0].hex;
          for (let j = 0; j < sorted.length - 1; j++) {
            const s0 = sorted[j].stop / 100, s1 = sorted[j + 1].stop / 100;
            if (t >= s0 && t <= s1) {
              const f = (t - s0) / (s1 - s0);
              color = lerpHex(sorted[j].hex, sorted[j + 1].hex, f);
              break;
            }
            color = sorted[sorted.length - 1].hex;
          }
          const rad0 = (deg - 0.25) * Math.PI / 180;
          const rad1 = (deg + 0.75) * Math.PI / 180;
          const far = Math.max(W, H);
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, far, rad0, rad1);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        }
        triggerDownload(canvas); return;
      }

      ctx.fillRect(0, 0, W, H);
      triggerDownload(canvas);
    });

    function lerpHex(h1, h2, t) {
      const r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
      const r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
      const r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function triggerDownload(canvas) {
      const btn = document.getElementById('btn-download');
      btn.textContent = '⏳ Generating…';
      btn.disabled = true;
      setTimeout(() => {
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `gradient-${Date.now()}.png`;
          a.click();
          URL.revokeObjectURL(url);
          btn.textContent = '✓ Downloaded!';
          setTimeout(() => { btn.textContent = '↓ Download 4K PNG'; btn.disabled = false; }, 2000);
        }, 'image/png');
      }, 50);
    }

    // ════════════════════════════════════════════
    //  PRESETS
    // ════════════════════════════════════════════
    PRESETS.forEach(colors => {
      const div = document.createElement('div');
      div.className = 'preset';
      div.style.background = `linear-gradient(135deg, ${colors.join(', ')})`;
      div.addEventListener('click', () => {
        state.colors = colors.map((hex, i) => ({
          hex, stop: Math.round((i / (colors.length - 1)) * 100), locked: false
        }));
        render();
      });
      presetsGrid.appendChild(div);
    });

    // ════════════════════════════════════════════
    //  UTILS
    // ════════════════════════════════════════════
    function randomHex() {
      return '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
    }

    render();
  </script>
</body>

</html>
