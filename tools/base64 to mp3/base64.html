<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 to File Converter</title>
  <link rel="stylesheet" href="../../Styles/Themes/dark.css"/>
  <link rel="stylesheet" href="../../Styles/main.css"/> 
  <link rel="stylesheet" href="../../Styles/Components/Components.css"/>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 4px;
      box-sizing: border-box;
      border: none;
      outline: none;
    }

    button {
      float: right;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Base64 to MP3 Converter</h2>
  <br>
  <textarea id="base64Input" placeholder="Paste your Base64 string here"></textarea>
  <br>
  <button class="button" onclick="downloadBase64File()">Download File</button>
</div>

<script>
  function downloadBase64File() {
    const base64String = document.getElementById("base64Input").value;

    if (!base64String) {
      alert("Please enter a Base64 string.");
      return;
    }

    try {
      // Clean the Base64 string (remove any data URL prefix)
      const cleanBase64 = base64String.split(",").pop();

      // Convert Base64 to a Blob
      const byteCharacters = atob(cleanBase64);
      const byteNumbers = new Uint8Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const blob = new Blob([byteNumbers], { type: "application/octet-stream" });

      // Create a link element
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "output.mp3"; // You can change the file name here

      // Programmatically click the link to trigger the download
      document.body.appendChild(link);
      link.click();
      link.remove(); // Clean up
    } catch (error) {
      alert("Invalid Base64 string or something went wrong!");
      console.error("Error:", error);
    }
  }
</script>

</body>
</html>
