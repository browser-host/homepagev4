<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's My IP?</title>

  <link id="sp-theme-tokens" rel="stylesheet">
  <link id="sp-theme-active" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/base.css">

  <link rel="stylesheet" href="../../Styles/Tokens/base.css"/>
  <link rel="stylesheet" href="../../Styles/Themes/manuscript.css"/>
  <link rel="stylesheet" href="../../Styles/main.css"/>
  <link rel="stylesheet" href="../../Styles/Components/Components.css"/>

  <style>
    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-7);
    }
    #ip-address {
      display: block;
      font-family: var(--font-mono);
      font-size: var(--text-xl);
      color: var(--color-accent);
      letter-spacing: var(--tracking-mono);
    }
  </style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">
  <sp-theme></sp-theme>
  <sp-nav sticky>
    <span slot="brand">What's My IP?</span>
  </sp-nav>

  <div class="page-content">
    <div class="card">
      <span id="ip-address">—</span>
      <sp-button id="retry-button" disabled onclick="handleRetryClick();">Retry</sp-button>
    </div>
  </div>

  <script type="text/javascript">
    function handleRetryClick() {
      document.getElementById('ip-address').textContent = '—';
      document.getElementById('retry-button').setAttribute('disabled', '');
      fetchIPAddress();
    }

    function fetchIPAddress() {
      fetch('https://api.ipify.org')
        .then(res => res.text())
        .then(data => {
          if (data && data !== '') {
            document.getElementById('ip-address').textContent = data;
            document.getElementById('retry-button').removeAttribute('disabled');
          }
        });
    }

    fetchIPAddress();
  </script>

  <script type="module">
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-theme.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-nav.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-button.js'
  </script>
</body>
</html>
