<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker</title>

  <link id="sp-theme-tokens" rel="stylesheet">
  <link id="sp-theme-active" rel="stylesheet">

  <link rel="stylesheet" href="../../Styles/Tokens/base.css"/>
  <link rel="stylesheet" href="../../Styles/Themes/manuscript.css"/>
  <link rel="stylesheet" href="../../Styles/main.css"/>
  <link rel="stylesheet" href="../../Styles/Components/Components.css"/>

  <style>
    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-9);
    }
    .card {
      margin: auto;
    }
    .color-container {
      width: 600px;
      display: flex;
      justify-content: space-around;
      margin-top: var(--space-9);
    }
    .color-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
    }
    .color-swatch {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-xl);
      border: var(--border-default);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-swatch:hover {
      transform: scale(1.08);
    }
    .color-input {
      margin-top: var(--space-2);
      width: 100px;
      text-align: center;
      padding: var(--space-3);
      border: var(--border-default);
      border-radius: var(--radius-md);
      background: var(--color-surface-2);
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      outline: none;
    }
    .color-input:focus {
      border-color: var(--color-accent);
    }
    input[type="color"] {
      border: none;
      background: none;
      cursor: pointer;
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">
  <sp-theme></sp-theme>
  <sp-nav sticky>
    <span slot="brand">Color Picker</span>
  </sp-nav>

  <div class="page-content">
    <div class="card">
      <h1>Pick a Color</h1>
      <div class="color-container">
        <div class="color-box">
          <input type="color" id="colorPicker1" title="Click to edit color">
          <div class="color-swatch" id="colorDisplay1" style="background-color:#000000;" title="Click to copy color"></div>
          <input type="text" class="color-input" id="colorInput1" value="#000000">
        </div>
        <div class="color-box">
          <input type="color" id="colorPicker2" title="Click to edit color">
          <div class="color-swatch" id="colorDisplay2" style="background-color:#000000;" title="Click to copy color"></div>
          <input type="text" class="color-input" id="colorInput2" value="#000000">
        </div>
        <div class="color-box">
          <input type="color" id="colorPicker3" title="Click to edit color">
          <div class="color-swatch" id="colorDisplay3" style="background-color:#000000;" title="Click to copy color"></div>
          <input type="text" class="color-input" id="colorInput3" value="#000000">
        </div>
      </div>
    </div>
  </div>

  <script>
    function setupColorPicker(pickerId, displayId, inputId) {
      const colorPicker = document.getElementById(pickerId);
      const colorDisplay = document.getElementById(displayId);
      const colorInput = document.getElementById(inputId);

      function updateColor(value) {
        colorDisplay.style.backgroundColor = value;
        colorInput.value = value;
        colorPicker.value = value;
      }

      colorPicker.addEventListener('input', function() { updateColor(this.value); });

      colorInput.addEventListener('input', function() {
        if (/^#([0-9A-F]{3}){1,2}$/i.test(this.value)) { updateColor(this.value); }
      });

      colorDisplay.addEventListener('click', function() {
        navigator.clipboard.writeText(colorInput.value);
        document.getElementById('toast').show('Color copied');
      });
    }

    setupColorPicker('colorPicker1', 'colorDisplay1', 'colorInput1');
    setupColorPicker('colorPicker2', 'colorDisplay2', 'colorInput2');
    setupColorPicker('colorPicker3', 'colorDisplay3', 'colorInput3');
  </script>

  <sp-toast id="toast"></sp-toast>

  <script type="module">
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-theme.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-nav.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-toast.js'
  </script>
</body>
</html>
