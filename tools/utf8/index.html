<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTF-8 Characters</title>

<link id="sp-theme-tokens" rel="stylesheet">
<link id="sp-theme-active" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components@latest/atomics.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: var(--font-family-base, "Segoe UI", Tahoma, sans-serif);
    background: var(--color-bg-subtle, #f3f3f3);
    color: var(--color-text, #1f1f1f);
  }
  body { display: flex; flex-direction: column; }
  sp-nav { flex-shrink: 0; }
  .main {
    flex: 1;
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 16px;
  }

  textarea, .search {
    font: inherit;
    font-size: 15px;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--color-border, #ddd);
    border-radius: 8px;
    background: var(--color-bg, #fff);
    color: var(--color-text, #1f1f1f);
  }
  textarea {
    min-height: 140px;
    resize: vertical;
    font-size: 16px;
    line-height: 1.5;
  }
  .summary {
    font-size: 13px;
    color: var(--color-text-subtle, #555);
  }

  /* Character cards */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card {
    position: relative;
    width: 48px;
    height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--color-border, #ddd);
    border-radius: 6px;
    background: var(--color-bg, #fff);
    color: var(--color-text, #1f1f1f);
    font: inherit;
    cursor: default;
  }
  .card:hover { border-color: var(--color-primary, #2563eb); }
  .card__glyph {
    font-size: 22px;
    line-height: 1;
    white-space: pre;
  }
  .card__code {
    position: absolute;
    bottom: 3px;
    font-size: 8px;
    font-family: Consolas, monospace;
    color: var(--color-text-subtle, #777);
  }
  /* invisible / control characters get a label instead of a glyph */
  .card--special { border-style: dashed; }
  .card--special .card__glyph {
    font-size: 10px;
    font-weight: 600;
    font-family: Consolas, monospace;
    color: var(--color-text-subtle, #555);
  }

  /* Browse tab */
  .browse-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 8px 0;
    background: var(--color-bg-subtle, #f3f3f3);
  }
  .groups {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .group-btn {
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    border: 1px solid var(--color-border, #ddd);
    border-radius: 999px;
    background: var(--color-bg, #fff);
    color: var(--color-text, #1f1f1f);
    cursor: pointer;
  }
  .group-btn[aria-pressed="true"] {
    background: var(--color-primary, #2563eb);
    border-color: var(--color-primary, #2563eb);
    color: var(--color-on-primary, #fff);
  }
  .group h2 {
    margin: 24px 0 4px;
    font-size: 18px;
  }
  .block { content-visibility: auto; contain-intrinsic-size: auto 300px; }
  .block h3 {
    margin: 14px 0 8px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-subtle, #555);
  }
  .block h3 span { font-weight: 400; font-family: Consolas, monospace; letter-spacing: 0; }
  #browse .card { cursor: pointer; }
  .empty {
    padding: 24px 0;
    color: var(--color-text-subtle, #555);
  }

  /* Hover details */
  .tip {
    position: fixed;
    z-index: 100;
    width: 280px;
    padding: 12px 14px;
    border: 1px solid var(--color-border, #ddd);
    border-radius: 10px;
    background: var(--color-bg, #fff);
    color: var(--color-text, #1f1f1f);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    pointer-events: none;
    font-size: 13px;
  }
  .tip[hidden] { display: none; }
  .tip__head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .tip__glyph {
    font-size: 40px;
    line-height: 1;
    min-width: 48px;
    text-align: center;
    white-space: pre;
  }
  .tip__name { font-weight: 600; line-height: 1.3; }
  .tip dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 12px;
    margin: 0;
  }
  .tip dt { color: var(--color-text-subtle, #555); }
  .tip dd { margin: 0; font-family: Consolas, monospace; word-break: break-all; }
</style>
</head>
<body>
  <sp-theme></sp-theme>
  <sp-nav>
    <span slot="brand">UTF-8 Characters</span>
  </sp-nav>

  <div class="main">
    <sp-tabs>
      <div data-label="Inspect text">
        <div class="panel">
          <textarea id="input" placeholder="Paste or type text here…" spellcheck="false" autofocus></textarea>
          <div class="summary" id="summary"></div>
          <div class="cards" id="cards"></div>
        </div>
      </div>
      <div data-label="All characters" hidden>
        <div class="panel">
          <div class="browse-controls">
            <input class="search" id="search" type="search" placeholder="Search by name, code (U+2192) or character…" spellcheck="false">
            <div class="groups" id="groups"></div>
          </div>
          <div id="browse"></div>
        </div>
      </div>
    </sp-tabs>
  </div>

  <div class="tip" id="tip" hidden></div>
  <sp-toast id="toast"></sp-toast>

<script type="module">
  import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-theme.js'
  import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-nav.js'
  import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-tabs.js'
  import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-toast.js'
</script>

<script src="unicode-data.js"></script>
<script>
  // * * * * * * * * * * * * *
  //       Character info
  // * * * * * * * * * * * * *

  const NAMES = new Map();
  for (const line of UNICODE_NAMES_RAW.split('\n')) {
    const i = line.indexOf(':');
    NAMES.set(parseInt(line.slice(0, i), 16), line.slice(i + 1));
  }

  // Hangul syllable names are built from their jamo parts
  const JAMO_L = ['G','GG','N','D','DD','R','M','B','BB','S','SS','','J','JJ','C','K','T','P','H'];
  const JAMO_V = ['A','AE','YA','YAE','EO','E','YEO','YE','O','WA','WAE','OE','YO','U','WEO','WE','WI','YU','EU','YI','I'];
  const JAMO_T = ['','G','GG','GS','N','NJ','NH','D','L','LG','LM','LB','LS','LT','LP','LH','M','B','BS','S','SS','NG','J','C','K','T','P','H'];

  const CATEGORIES = [
    ['Lu', 'Uppercase letter'], ['Ll', 'Lowercase letter'], ['Lt', 'Titlecase letter'],
    ['Lm', 'Modifier letter'], ['Lo', 'Other letter'],
    ['Mn', 'Nonspacing mark'], ['Mc', 'Spacing mark'], ['Me', 'Enclosing mark'],
    ['Nd', 'Decimal number'], ['Nl', 'Letter number'], ['No', 'Other number'],
    ['Pc', 'Connector punctuation'], ['Pd', 'Dash punctuation'], ['Ps', 'Open punctuation'],
    ['Pe', 'Close punctuation'], ['Pi', 'Initial quote'], ['Pf', 'Final quote'], ['Po', 'Other punctuation'],
    ['Sm', 'Math symbol'], ['Sc', 'Currency symbol'], ['Sk', 'Modifier symbol'], ['So', 'Other symbol'],
    ['Zs', 'Space separator'], ['Zl', 'Line separator'], ['Zp', 'Paragraph separator'],
    ['Cc', 'Control'], ['Cf', 'Format'], ['Cs', 'Surrogate'], ['Co', 'Private use'],
  ].map(([code, label]) => [code, label, new RegExp(`^\\p{${code}}$`, 'u')]);

  function category(ch) {
    for (const [code, label, re] of CATEGORIES) if (re.test(ch)) return { code, label };
    return { code: 'Cn', label: 'Unassigned' };
  }

  function charName(cp) {
    if (NAMES.has(cp)) return NAMES.get(cp);
    const hex = hex4(cp);
    if ((cp >= 0x3400 && cp <= 0x4DBF) || (cp >= 0x4E00 && cp <= 0x9FFF) || (cp >= 0x20000 && cp <= 0x323AF)) {
      return 'CJK UNIFIED IDEOGRAPH-' + hex;
    }
    if ((cp >= 0xF900 && cp <= 0xFAFF) || (cp >= 0x2F800 && cp <= 0x2FA1F)) return 'CJK COMPATIBILITY IDEOGRAPH-' + hex;
    if (cp >= 0xAC00 && cp <= 0xD7A3) {
      const s = cp - 0xAC00;
      return 'HANGUL SYLLABLE ' + JAMO_L[Math.floor(s / 588)] + JAMO_V[Math.floor((s % 588) / 28)] + JAMO_T[s % 28];
    }
    if (cp >= 0x17000 && cp <= 0x187FF) return 'TANGUT IDEOGRAPH-' + hex;
    const cat = category(String.fromCodePoint(cp)).code;
    if (cat === 'Co') return 'PRIVATE USE CHARACTER';
    if (cat === 'Cs') return 'SURROGATE';
    return 'UNKNOWN CHARACTER';
  }

  const BLOCKS = UNICODE_BLOCKS.map(([group, name, start, end]) => ({ group, name, start, end }));
  function blockOf(cp) {
    return BLOCKS.find(b => cp >= b.start && cp <= b.end)?.name;
  }

  function hex4(cp) { return cp.toString(16).toUpperCase().padStart(4, '0'); }

  const encoder = new TextEncoder();
  function utf8Bytes(ch) {
    return [...encoder.encode(ch)].map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
  }
  function utf16Units(ch) {
    return Array.from({ length: ch.length }, (_, i) => hex4(ch.charCodeAt(i))).join(' ');
  }

  // Short labels for characters that would otherwise render as nothing
  const LABELS = {
    0x09: 'TAB', 0x0A: 'LF', 0x0D: 'CR', 0x20: 'SP', 0x7F: 'DEL', 0xA0: 'NBSP', 0xAD: 'SHY',
    0x2002: 'ENSP', 0x2003: 'EMSP', 0x2007: 'FSP', 0x2008: 'PSP', 0x2009: 'THSP', 0x200A: 'HSP',
    0x200B: 'ZWSP', 0x200C: 'ZWNJ', 0x200D: 'ZWJ', 0x200E: 'LRM', 0x200F: 'RLM',
    0x2028: 'LSEP', 0x2029: 'PSEP', 0x202F: 'NNBSP', 0x205F: 'MMSP', 0x2060: 'WJ',
    0x3000: 'IDSP', 0xFEFF: 'BOM',
  };

  // What to put in the middle of a card
  function display(cp) {
    const ch = String.fromCodePoint(cp);
    const cat = category(ch).code;
    if (LABELS[cp]) return { text: LABELS[cp], special: true };
    if (cp >= 0xFE00 && cp <= 0xFE0F) return { text: 'VS' + (cp - 0xFDFF), special: true };
    if (/^(Z.|Cc|Cf|Cs|Cn)$/.test(cat)) return { text: hex4(cp), special: true };
    if (cat === 'Mn' || cat === 'Me') return { text: '◌' + ch, special: false };
    return { text: ch, special: false };
  }

  function makeCard(cp, tag = 'div') {
    const el = document.createElement(tag);
    const d = display(cp);
    el.className = 'card' + (d.special ? ' card--special' : '');
    el.dataset.cp = cp;
    const glyph = document.createElement('span');
    glyph.className = 'card__glyph';
    glyph.textContent = d.text;
    const code = document.createElement('span');
    code.className = 'card__code';
    code.textContent = hex4(cp);
    el.append(glyph, code);
    return el;
  }

  // * * * * * * * * * * * * *
  //       Hover details
  // * * * * * * * * * * * * *

  const tip = document.getElementById('tip');

  function showTip(card) {
    const cp = Number(card.dataset.cp);
    const ch = String.fromCodePoint(cp);
    const d = display(cp);
    const cat = category(ch);
    const rows = [
      ['Code point', 'U+' + hex4(cp)],
      ['Decimal', cp],
      ['UTF-8', utf8Bytes(ch)],
      ['UTF-16', utf16Units(ch)],
      ['HTML', '&#x' + cp.toString(16).toUpperCase() + ';'],
      ['JS', cp > 0xFFFF ? `\\u{${cp.toString(16).toUpperCase()}}` : '\\u' + hex4(cp)],
      ['Category', `${cat.label} (${cat.code})`],
      ['Block', blockOf(cp) ?? '—'],
    ];
    tip.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'tip__head';
    const g = document.createElement('div');
    g.className = 'tip__glyph';
    g.textContent = d.text;
    const n = document.createElement('div');
    n.className = 'tip__name';
    n.textContent = charName(cp);
    head.append(g, n);
    const dl = document.createElement('dl');
    for (const [k, v] of rows) {
      const dt = document.createElement('dt');
      dt.textContent = k;
      const dd = document.createElement('dd');
      dd.textContent = v;
      dl.append(dt, dd);
    }
    tip.append(head, dl);
    tip.hidden = false;

    // place below the card, flipping above / shifting left when near the edge
    const r = card.getBoundingClientRect();
    const t = tip.getBoundingClientRect();
    let top = r.bottom + 8;
    if (top + t.height > window.innerHeight - 8) top = r.top - t.height - 8;
    const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
    tip.style.top = Math.max(8, top) + 'px';
    tip.style.left = left + 'px';
  }

  document.addEventListener('mouseover', e => {
    const card = e.target.closest('.card');
    if (card) showTip(card);
    else tip.hidden = true;
  });
  document.addEventListener('scroll', () => tip.hidden = true, true);

  // * * * * * * * * * * * * *
  //        Inspect tab
  // * * * * * * * * * * * * *

  const input = document.getElementById('input');
  const cardsEl = document.getElementById('cards');
  const summaryEl = document.getElementById('summary');

  function renderInspect() {
    const text = input.value;
    const frag = document.createDocumentFragment();
    let count = 0;
    for (const ch of text) {
      frag.append(makeCard(ch.codePointAt(0)));
      count++;
    }
    cardsEl.replaceChildren(frag);
    tip.hidden = true;
    summaryEl.textContent = count
      ? `${count} character${count === 1 ? '' : 's'} · ${encoder.encode(text).length} bytes in UTF-8`
      : '';
  }
  input.addEventListener('input', renderInspect);
  renderInspect();

  // * * * * * * * * * * * * *
  //      All characters tab
  // * * * * * * * * * * * * *

  const browseEl = document.getElementById('browse');
  const searchEl = document.getElementById('search');
  const groupsEl = document.getElementById('groups');
  const toast = document.getElementById('toast');

  const GROUPS = [...new Set(BLOCKS.map(b => b.group))];
  let activeGroup = null;

  // every assigned character in the listed blocks, with its name pre-lowercased for search
  for (const b of BLOCKS) {
    b.chars = [];
    for (let cp = b.start; cp <= b.end; cp++) {
      if (NAMES.has(cp)) b.chars.push({ cp, name: NAMES.get(cp).toLowerCase() });
    }
  }

  [null, ...GROUPS].forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'group-btn';
    btn.textContent = g ?? 'All';
    btn.setAttribute('aria-pressed', String(g === activeGroup));
    btn.addEventListener('click', () => {
      activeGroup = g;
      groupsEl.querySelectorAll('.group-btn').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      renderBrowse();
    });
    groupsEl.append(btn);
  });

  function matcher(query) {
    const q = query.trim().toLowerCase();
    if (!q) return () => true;
    // "U+2192", "0x2192" or a bare hex code
    const hexMatch = q.match(/^(?:u\+|0x)?([0-9a-f]{2,6})$/);
    const hexCp = hexMatch ? parseInt(hexMatch[1], 16) : null;
    // a single pasted character
    const chars = [...query.trim()];
    const literalCp = chars.length === 1 ? chars[0].codePointAt(0) : null;
    const words = q.split(/\s+/);
    return c => c.cp === hexCp || c.cp === literalCp || words.every(w => c.name.includes(w));
  }

  function renderBrowse() {
    const match = matcher(searchEl.value);
    const frag = document.createDocumentFragment();
    let total = 0;
    for (const group of GROUPS) {
      if (activeGroup && group !== activeGroup) continue;
      const section = document.createElement('section');
      section.className = 'group';
      const h2 = document.createElement('h2');
      h2.textContent = group;
      section.append(h2);
      let groupCount = 0;
      for (const b of BLOCKS.filter(b => b.group === group)) {
        const hits = b.chars.filter(match);
        if (!hits.length) continue;
        groupCount += hits.length;
        const block = document.createElement('div');
        block.className = 'block';
        const h3 = document.createElement('h3');
        h3.textContent = b.name + ' ';
        const range = document.createElement('span');
        range.textContent = `U+${hex4(b.start)}–U+${hex4(b.end)}`;
        h3.append(range);
        const cards = document.createElement('div');
        cards.className = 'cards';
        for (const c of hits) cards.append(makeCard(c.cp, 'button'));
        block.append(h3, cards);
        section.append(block);
      }
      if (groupCount) {
        frag.append(section);
        total += groupCount;
      }
    }
    if (!total) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No characters match.';
      frag.append(empty);
    }
    browseEl.replaceChildren(frag);
    tip.hidden = true;
  }

  let searchTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderBrowse, 150);
  });

  browseEl.addEventListener('click', async e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const ch = String.fromCodePoint(Number(card.dataset.cp));
    try {
      await navigator.clipboard.writeText(ch);
      toast.show(`Copied ${ch}`);
    } catch {
      toast.show('Could not copy');
    }
  });

  renderBrowse();
</script>
</body>
</html>
