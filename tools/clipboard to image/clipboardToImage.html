<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipboard to Image</title>
  <link rel="stylesheet" href="../../Styles/Themes/dark.css"/>
  <link rel="stylesheet" href="../../Styles/main.css"/>
  <link rel="stylesheet" href="../../Styles/Components/Components.css"/>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text-color);
      background: var(--bg-main);
    }
    img {
      max-width: 100%;
      max-height: 400px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Clipboard to Image</h1>
  <label>
    <input type="checkbox" id="formatToggle"> JPEG
  </label>
  <button class="button" onclick="handlePaste()">Paste Image</button>
  <img id="output" alt="Clipboard Image" class="d-none">

  <script>
    async function handlePaste() {
      try {
        const clipboardItems = await navigator.clipboard.read();
        const format = document.getElementById('formatToggle').checked ? 'image/jpeg' : 'image/png';
        
        for (const item of clipboardItems) {
          if (item.types.includes(format)) {
            const blob = await item.getType(format);
            const url = URL.createObjectURL(blob);
            
            // show image
            var image = document.getElementById('output')
            image.src = url;
            image.classList.remove('d-none');
            
            // Automatically download the image
            const a = document.createElement('a');
            a.href = url;
            a.download = `clipboard_image.${format.split('/')[1]}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            
            break;
          }
        }
      } catch (error) {
        console.error("Error reading clipboard: ", error);
      }
    }
  </script>
</body>
</html>
