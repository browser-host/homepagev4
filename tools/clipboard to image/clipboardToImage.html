<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipboard to Image</title>

  <link id="sp-theme-tokens" rel="stylesheet">
  <link id="sp-theme-active" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/base.css">

  <link rel="stylesheet" href="../../Styles/Tokens/base.css"/>
  <link rel="stylesheet" href="../../Styles/Themes/manuscript.css"/>
  <link rel="stylesheet" href="../../Styles/main.css"/>
  <link rel="stylesheet" href="../../Styles/Components/Components.css"/>

  <style>
    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-7);
      padding: var(--space-9);
    }
    .format-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--color-text);
    }
    img {
      max-width: 100%;
      max-height: 400px;
      border: var(--border-default);
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">
  <sp-theme></sp-theme>
  <sp-nav sticky>
    <span slot="brand">Clipboard to Image</span>
  </sp-nav>

  <div class="page-content">
    <div class="format-row">
      <label>
        <input type="checkbox" id="formatToggle"> JPEG
      </label>
    </div>
    <sp-button variant="primary" onclick="handlePaste()">Paste Image</sp-button>
    <img id="output" alt="Clipboard Image" class="d-none">
  </div>

  <script>
    async function handlePaste() {
      try {
        const clipboardItems = await navigator.clipboard.read();
        const format = document.getElementById('formatToggle').checked ? 'image/jpeg' : 'image/png';

        for (const item of clipboardItems) {
          if (item.types.includes(format)) {
            const blob = await item.getType(format);
            const url = URL.createObjectURL(blob);

            const image = document.getElementById('output');
            image.src = url;
            image.classList.remove('d-none');

            const a = document.createElement('a');
            a.href = url;
            a.download = `clipboard_image.${format.split('/')[1]}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            break;
          }
        }
      } catch (error) {
        console.error('Error reading clipboard: ', error);
      }
    }
  </script>

  <script type="module">
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-theme.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-nav.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-button.js'
  </script>
</body>
</html>
