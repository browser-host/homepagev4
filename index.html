<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need a Thing</title>

  <!-- Design system -->
  <link rel="stylesheet" href="./Styles/Themes/dark.css" data-theme-sheet>
  <link rel="stylesheet" href="./Styles/main.css">
  <link rel="stylesheet" href="./Styles/Components/Components.css">
  <link rel="stylesheet" href="./Styles/atomics.css">
  <link rel="stylesheet" href="homepage.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&family=Agdasima:wght@400;700&display=swap" rel="stylesheet">

  <!-- Quill (rich text editor) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

  <!-- App JS -->
  <script src="./JS/utility.js"></script>
  <script src="./JS/settings.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <div class="layout">

    <!-- ── Sidebar: Quick Links ── -->
    <div class="sidebar-container card">
      <div id="links-list-container">
        <div class="sidebar-header">
          <div id="add-link" onclick="openLinkModal();">
            Quick Links
          </div>
          <button class="btn btn--ghost btn--sm sidebar-organize-btn" onclick="openOrganizeModal();" title="Organize links">
            Organize
          </button>
        </div>
      </div>
    </div>

    <!-- ── Topbar: Search ── -->
    <div class="topbar-container card">
      <div id="search-bar-container">
        <div class="title" data-engine-index="0" id="search-bar-title">
          consult the oracle
        </div>
        <div class="search">
          <input id="searchBarInput" autocomplete="off" tabindex="1" placeholder="search…" />
        </div>
      </div>
    </div>

    <!-- ── Main: Tools ── -->
    <div class="main-container card">
      <div id="tools-container">
        <div id="tools-list-container"></div>
      </div>
    </div>

  </div>

  <!-- ── Modal: Add Quick Link ── -->
  <div id="modal" class="modal d-none">
    <div class="modal__backdrop" onclick="closeLinkModal();"></div>
    <div class="modal__dialog">

      <div class="modal__header">
        <span class="modal__title">Add Quick Link</span>
        <button class="modal__close icon-hover-default" onclick="closeLinkModal();" aria-label="Close">
          <span class="icon icon--x icon--sm"></span>
        </button>
      </div>

      <div class="modal__body">
        <form id="add-link-form" class="form" onsubmit="handleNewLinkSubmit(event);">
          <div class="form__fields">

            <div class="form__group">
              <label class="form__label" for="input-link-title">Title</label>
              <input class="input w-full" type="text" id="input-link-title" name="input-link-title" autocomplete="off" />
            </div>

            <div class="form__group">
              <label class="form__label" for="input-link-href">URL</label>
              <input class="input w-full" type="text" id="input-link-href" name="input-link-href" autocomplete="off" />
            </div>

            <div class="form__group">
              <label class="form__label">Category</label>
              <div class="form__split">
                <select class="select" id="select-link-category" name="select-link-category"></select>
                <span class="form__split-or">or</span>
                <input class="input flex-1" type="text" name="input-link-category" autocomplete="off" placeholder="new category…" />
              </div>
            </div>

          </div>

          <div class="form__actions">
            <button class="btn" type="button" onclick="closeLinkModal();">Cancel</button>
            <button class="btn btn--primary" type="submit">Add Link</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- ── Modal: Organize Quick Links ── -->
  <div id="organize-modal" class="modal d-none">
    <div class="modal__backdrop" onclick="closeOrganizeModal();"></div>
    <div class="modal__dialog modal__dialog--wide">

      <div class="modal__header">
        <span class="modal__title">Organize Links</span>
        <button class="modal__close icon-hover-default" onclick="closeOrganizeModal();" aria-label="Close">
          <span class="icon icon--x icon--sm"></span>
        </button>
      </div>

      <div class="modal__body">
        <p class="org-instructions">Drag categories and links to reorder. Links can be moved between categories.</p>
        <div id="organize-list" class="org-list"></div>
        <div class="form__actions" style="margin-top: var(--space-8);">
          <button class="btn" type="button" onclick="closeOrganizeModal();">Cancel</button>
          <button class="btn btn--primary" type="button" onclick="saveOrganized();">Save Order</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
