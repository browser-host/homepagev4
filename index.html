<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need a Thing</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./Styles/main.css" />
  <link rel="stylesheet" href="./Styles/Components/Base.css" />
  <link rel="stylesheet" href="./Styles/Themes/dark.css" />
  <link rel="stylesheet" href="homepage.css" />
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap" rel="stylesheet">

  <!-- JS -->
  <script src="main.js"></script>
  
  <!-- Quill (rich text editor) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

</head>
<body>
  <div class="layout">
    <!-- Quick links -->
    <div class="sidebar-container card">
      <div id="links-list-container">
        <div id="add-link" class="card-header" onclick="openModal();">
          Quick Links
        </div>
      </div>
    </div>

    <!-- search bar -->
    <div class="topbar-container card">
      <div id="search-bar-container">
        <div class="title" data-engine-index="0" id="search-bar-title">
          consult the oracle
        </div>
        <div class="search">
          <input id="searchBarInput" autocomplete="off" tabindex="1"/>
        </div>
      </div>
    </div>

    <div class="main-container card">
      <div id="tools-container">
        <div id="tools-list-container"></div>
      </div>
    </div>
  </div>

  <div id="modal" class="d-none">
    <div id="modal-exit" onclick="closeModal();">
      <img class="icon" src="icons/x.svg" alt="Exit">
    </div>

    <div id="modal-content" class="hidden">
      <form id="add-link-form" class="form" onsubmit="handleNewLinkSubmit(event);">
        <div class="form-content">
          <div>
            <div>Title</div>
            <input type="text" name="input-link-title" autocomplete="off"/>
          </div>
          
          <div>
            <div>URL</div>
            <input type="text" name="input-link-href" autocomplete="off"/>
          </div>
          
          <div>
            <div>Category</div>
            <div class="double">
              <select id="select-link-category" name="select-link-category"></select>
              <span>or</span>
              <input type="text" name="input-link-category" autocomplete="off" placeholder="enter for new category"/>
            </div>
          </div>
        </div>

        <div class="button-row">
          <button onclick="closeModal();">Cancel</button>
          <button type="submit">Add</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
