<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need a Thing</title>

  <!-- sp-theme placeholder links: sp-theme.js finds these by ID and sets their hrefs.
       Positioned before dark.css so the page theme tokens win the cascade. -->
  <link id="sp-theme-tokens" rel="stylesheet">
  <link id="sp-theme-active" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/base.css">

  <!-- Design system -->
  <link rel="stylesheet" href="./Styles/Tokens/base.css">
  <link rel="stylesheet" href="./Styles/Themes/manuscript.css">
  <link rel="stylesheet" href="./Styles/main.css">
  <link rel="stylesheet" href="./Styles/Components/Components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/atomics.css">
  <link rel="stylesheet" href="homepage.css" />


  <!-- Quill (rich text editor) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

  <!-- App JS -->
  <script src="./JS/utility.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <sp-theme></sp-theme>

  <sp-nav sticky>
    <span slot="brand">Need a Thing</span>
  </sp-nav>

  <div class="layout">

    <!-- ── Sidebar: Quick Links ── -->
    <sp-card class="sidebar-container">
      <div id="links-list-container">
        <div class="sidebar-header">
          <div id="add-link" onclick="openLinkModal();">
            Quick Links
          </div>
          <sp-button variant="ghost" size="sm" onclick="openOrganizeModal();" title="Organize links">
            Organize
          </sp-button>
        </div>
      </div>
    </sp-card>

    <!-- ── Topbar: Search ── -->
    <sp-card class="topbar-container">
      <div id="search-bar-container">
        <div class="title" data-engine-index="0" id="search-bar-title">
          consult the oracle
        </div>
        <div class="search">
          <input id="searchBarInput" autocomplete="off" tabindex="1" placeholder="search…" />
        </div>
      </div>
    </sp-card>

    <!-- ── Main: Tools ── -->
    <sp-card class="main-container">
      <div id="tools-container">
        <div id="tools-list-container"></div>
      </div>
    </sp-card>

  </div>

  <!-- ── Modal: Add Quick Link ── -->
  <sp-modal id="modal" heading="Add Quick Link">
    <form id="add-link-form" class="form" onsubmit="handleNewLinkSubmit(event);">
      <div class="form__fields">

        <div class="form__group">
          <label class="form__label" for="input-link-title">Title</label>
          <input class="input w-full" type="text" id="input-link-title" name="input-link-title" autocomplete="off" />
        </div>

        <div class="form__group">
          <label class="form__label" for="input-link-href">URL</label>
          <input class="input w-full" type="text" id="input-link-href" name="input-link-href" autocomplete="off" />
        </div>

        <div class="form__group">
          <label class="form__label">Category</label>
          <div class="form__split">
            <select class="select" id="select-link-category" name="select-link-category"></select>
            <span class="form__split-or">or</span>
            <input class="input flex-1" type="text" name="input-link-category" autocomplete="off" placeholder="new category…" />
          </div>
        </div>

      </div>
    </form>
    <div class="form__actions" slot="footer">
      <sp-button onclick="closeLinkModal();">Cancel</sp-button>
      <sp-button variant="primary" onclick="document.getElementById('add-link-form').requestSubmit();">Add Link</sp-button>
    </div>
  </sp-modal>

  <!-- ── Link Palette (keyboard quick-launcher, built on sp-modal) ── -->
  <sp-modal id="link-palette" class="palette" aria-label="Jump to link">
    <div class="palette__search">
      <sp-icon class="palette__search-icon" name="magnifying-glass" size="sm"></sp-icon>
      <input id="palette-input" class="palette__input" type="text" autocomplete="off"
             placeholder="jump to a link…" />
    </div>
    <div id="palette-results" class="palette__results"></div>
    <div class="palette__hint" slot="footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>ctrl</kbd>+<kbd>↵</kbd> new tab</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </sp-modal>

  <!-- ── Modal: Organize Quick Links ── -->
  <sp-modal id="organize-modal" heading="Organize Links" style="--sp-modal-width: 560px;">
    <p class="org-instructions">Drag categories and links to reorder. Links can be moved between categories.</p>
    <div id="organize-list" class="org-list"></div>
    <div class="form__actions" slot="footer">
      <sp-button onclick="closeOrganizeModal();">Cancel</sp-button>
      <sp-button variant="primary" onclick="saveOrganized();">Save Order</sp-button>
    </div>
  </sp-modal>


  <script type="module">
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-theme.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-nav.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-button.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-card.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-modal.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-tag.js'
    import 'https://cdn.jsdelivr.net/gh/Seth-Harlaar/sp-components/components/sp-icon.js'
  </script>
</body>
</html>
